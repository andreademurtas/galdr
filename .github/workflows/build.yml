name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev xvfb ffmpeg

      - name: Configure (macOS universal binary)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"

      - name: Configure
        if: runner.os != 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sLO https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            7z x -y pluginval_Windows.zip > /dev/null
            ./pluginval.exe --strictness-level 5 --validate "build/Galdr_artefacts/Release/VST3/Galdr.vst3"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            curl -sLO https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q -o pluginval_macOS.zip
            pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "build/Galdr_artefacts/Release/VST3/Galdr.vst3"
          else
            curl -sLO https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
            unzip -q -o pluginval_Linux.zip
            xvfb-run --auto-servernum ./pluginval --strictness-level 5 --validate "build/Galdr_artefacts/Release/VST3/Galdr.vst3"
          fi

      # pluginval has no CLAP support; clap-validator is the free-audio tool.
      # Pinned to an exact release asset because the names carry a build suffix.
      # The state-reproducibility tests are excluded: clap-juce-extensions (at
      # upstream head) fails them for every JUCE/APVTS plugin, Galdr included;
      # values restored via setStateInformation read back as defaults through
      # the CLAP params extension. Re-enable once the wrapper is fixed upstream.
      - name: Validate CLAP with clap-validator
        shell: bash
        run: |
          base=https://github.com/free-audio/clap-validator/releases/download/0.4.1
          stem=clap-validator-0.4.1-127-g152b982
          mkdir -p validator
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -sLO "$base/$stem-windows.zip"
            7z x -y "$stem-windows.zip" -ovalidator > /dev/null
            validator/clap-validator.exe validate -x state-reproducibility "build/Galdr_artefacts/Release/CLAP/Galdr.clap"
          else
            # The unix release zips wrap a tarball with the binary at binaries/clap-validator.
            [ "$RUNNER_OS" = "macOS" ] && asset="$stem-macos-universal.zip" || asset="$stem-ubuntu-22.04.zip"
            curl -sLO "$base/$asset"
            unzip -q -o "$asset" -d validator
            tar xzf "$(find validator -name '*.tar.gz' | head -1)" -C validator
            bin=$(find validator -type f -name clap-validator | head -1)
            chmod +x "$bin"
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run --auto-servernum "$bin" validate -x state-reproducibility "build/Galdr_artefacts/Release/CLAP/Galdr.clap"
            else
              "$bin" validate -x state-reproducibility "build/Galdr_artefacts/Release/CLAP/Galdr.clap"
            fi
          fi

      - name: Package
        shell: bash
        run: |
          mkdir dist
          stage=build/Galdr_artefacts/Release
          cp LICENSE "$stage/LICENSE.txt"
          cp NOTICE.txt "$stage/NOTICE.txt"
          mkdir "$stage/licenses"
          cp licenses/AGPL-3.0.txt "$stage/licenses/JUCE-AGPL-3.0.txt"
          cp assets/fonts/OFL-UnifrakturMaguntia.txt assets/fonts/OFL-IMFellEnglish.txt "$stage/licenses/"
          cp JUCE/modules/juce_audio_processors_headless/format_types/VST3_SDK/LICENSE.txt "$stage/licenses/VST3-SDK-MIT.txt"
          cp modules/clap-juce-extensions/clap-libs/clap/LICENSE "$stage/licenses/CLAP-MIT.txt"
          cp modules/clap-juce-extensions/LICENSE.md "$stage/licenses/clap-juce-extensions-MIT.txt"
          cd "$stage"
          dirs="LICENSE.txt NOTICE.txt licenses"
          for d in VST3 CLAP AU Standalone; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -E tar cf "../../../dist/Galdr-Windows.zip" --format=zip $dirs
          else
            # tar preserves the executable bits that zip would lose
            tar czf "../../../dist/Galdr-$RUNNER_OS.tar.gz" $dirs
          fi

      - name: Render audio demos
        if: runner.os == 'Linux'
        run: |
          cmake --build build --config Release --parallel --target GaldrDemoRender
          xvfb-run --auto-servernum ./build/GaldrDemoRender_artefacts/Release/GaldrDemoRender demo-out
          sed -i 's/\r$//' demo-out/segments.txt
          i=0
          while IFS='|' read -r _ name start dur; do
            i=$((i+1))
            slug=$(printf "%02d-%s" "$i" "$(echo "$name" | tr 'A-Z' 'a-z' | tr ' ' '-')")
            ffmpeg -nostdin -loglevel error -y -ss "$start" -t "$dur" -i demo-out/galdr-demo.wav \
              -c:a libmp3lame -b:a 256k "dist/$slug.mp3"
          done < demo-out/segments.txt
          ffmpeg -nostdin -loglevel error -y -i demo-out/galdr-demo.wav -c:a libmp3lame -b:a 256k dist/galdr-demo-full.mp3

      - uses: actions/upload-artifact@v4
        with:
          name: Galdr-${{ runner.os }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: dist/*
